# Ecosystem-ci smoke test: the project's only workflow (cd.yml) runs on pushes to master,
# so pull requests get no checks. This runs the same `vp check` and `vp build` steps on
# pull requests. Delete it once the upstream repo runs a verifiable workflow on PRs.
name: ecosystem-ci build

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: 24
          cache: true

      - name: vp check
        run: vp check

      - name: vp build
        run: vp build
